name: Docs

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pdoc
          # Install runtime dependencies required for importing UGLD during pdoc
          python3 -m pip install torch
          # Install package itself to ensure pdoc can import it
          python3 -m pip install .

      - name: Generate pdoc site
        env:
          PYTHONPATH: src
        run: |
          rm -rf site
          python3 -m pdoc -o site --search --show-source ugld

          # ensure root index page points to module docs and provides simple adoption guide
          cp docs/index-template.html site/index.html


      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy UGLD docs from GitHub Actions"
