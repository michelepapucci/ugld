name: Docs

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdoc

      - name: Generate pdoc site
        env:
          PYTHONPATH: src
        run: |
          rm -rf site
          python3 -m pdoc -o site --search --show-source ugld

          # ensure root index page points to module docs and provides simple adoption guide
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>UGLD Documentation</title>
            </head>
            <body>
              <h1>UGLD Documentation</h1>
              <p>Welcome to the UGLD docs site.</p>
              <p>
                API docs: <a href="ugld.html">UGLD API reference</a>
              </p>
              <p>
                Quick start and tutorial in <code>README.md</code> (repo root).
              </p>
            </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy UGLD docs from GitHub Actions"
