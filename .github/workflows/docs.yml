name: Docs

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pdoc
          # Install runtime dependencies required for importing UGLD during pdoc
          python3 -m pip install torch
          # Install package itself to ensure pdoc can import it
          python3 -m pip install .

      - name: Generate pdoc site
        env:
          PYTHONPATH: src
        run: |
          rm -rf site
          python3 -m pdoc -o site --search --show-source ugld

          # ensure root index page points to module docs and provides simple adoption guide
          cp docs/index-template.html site/index.html

          # inject back-to-index link and its styling into the pdoc-generated API page
          python3 - <<'EOF'
import re

with open("site/ugld.html") as f:
    html = f.read()

# 1. inject the back link into the nav
html = html.replace(
    "<div>\n\n\n\n\n            <h2>API Documentation</h2>",
    '<div>\n            <a href="index.html" class="back-to-index">&#8592; Back to index</a>\n\n\n\n\n            <h2>API Documentation</h2>',
    1,
)

# 2. inject styles into the existing custom.css block
css = """
.back-to-index {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    color: var(--text);
    text-decoration: none;
    font-size: 0.85rem;
    opacity: 0.65;
    transition: opacity 150ms;
    margin-bottom: 1rem;
    padding-left: clamp(0.5rem, 2vw, 1.75rem);
}
.back-to-index:hover { opacity: 1; }
"""
html = html.replace("/*! custom.css */", "/*! custom.css */" + css, 1)

with open("site/ugld.html", "w") as f:
    f.write(html)
EOF


      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy UGLD docs from GitHub Actions"
